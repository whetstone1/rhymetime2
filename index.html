    // ─── CONSTANTS ───────────────────────────────────────────────────────
    const EPOCH = 20493;
    const MAX_HINTS = 3;
    const RANKS = [
      { name: "Beginner", threshold: 0 },
      { name: "Good Start", threshold: 0.05 },
      { name: "Moving Up", threshold: 0.12 },
      { name: "Good", threshold: 0.20 },
      { name: "Solid", threshold: 0.30 },
      { name: "Nice", threshold: 0.42 },
      { name: "Great", threshold: 0.55 },
      { name: "Amazing", threshold: 0.70 },
      { name: "Genius", threshold: 0.85 },
      { name: "Rhyme Master", threshold: 1.0 },
    ];

    function getRank(pts, max) {
      if (max === 0) return RANKS[0];
      const p = pts / max; let r = RANKS[0];
      for (const x of RANKS) { if (p >= x.threshold) r = x; }
      return r;
    }
    function dayNum() { const d=new Date().toLocaleDateString("en-CA",{timeZone:"America/New_York"}); return Math.floor(new Date(d+"T00:00:00Z").getTime()/86400000); }
    function seeded(s) { let x = s|0; x=((x>>16)^x)*0x45d9f3b|0; x=((x>>16)^x)*0x45d9f3b|0; x=(x>>16)^x; return (x & 0x7fffffff)/0x7fffffff; }
    function puzzleForDay(off=0) { const d=dayNum()+off; return PUZZLES[Math.floor(seeded(d+42)*PUZZLES.length)%PUZZLES.length]; }
    function puzzleNumber(off=0) { return Math.max(1, dayNum()+off-EPOCH+1); }
    function dateStr(off=0) { const d=new Date(); d.setDate(d.getDate()+off); return d.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",timeZone:"America/New_York"}); }

    const LS = {
      get: k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
      set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
    };
    const gameKey = (off=0) => `rt-${dayNum()+off}`;
    const DEF_STATS = { games:0, wins:0, ranks:{}, streak:0, maxStreak:0, lastDay:0 };

    function loadHistory() {
      const games = [];
      const today = dayNum();
      // Scan back up to 100 days
      for (let i = 1; i <= 100; i++) {
        const d = today - i;
        const save = LS.get(`rt-${d}`);
        if (!save?.found || !save?.target) continue;
        const p = puzzleForDay(-i);
        if (!p || p.target !== save.target) continue;
        const pts = save.found.reduce((a,w)=>a+w.length, 0);
        const maxPts = p.rhymes.reduce((a,w)=>a+w.length, 0);
        const missed = p.rhymes.filter(w => !save.found.includes(w));
        const pn = puzzleNumber(-i);
        const dt = new Date(); dt.setDate(dt.getDate() - i);
        const label = dt.toLocaleDateString("en-US",{month:"short",day:"numeric",timeZone:"America/New_York"});
        games.push({ num: pn, target: p.target, found: save.found, missed, total: p.rhymes.length,
          pts, maxPts, rank: getRank(pts, maxPts).name, label, done: save.found.length === p.rhymes.length, hints: save.hints?.length || 0 });
      }
      return games;
    }

    // ─── MAIN APP ────────────────────────────────────────────────────────
    function RhymeTime() {
      const puzzle = useMemo(() => puzzleForDay(0), []);
      const pNum = useMemo(() => puzzleNumber(0), []);
      const maxPts = useMemo(() => puzzle.rhymes.reduce((a,w)=>a+w.length,0), [puzzle]);

      const [found, setFound] = useState(() => {
        const s=LS.get(gameKey()); return (s?.found && s?.target===puzzle.target) ? s.found : [];
      });
      const [hintsUsed, setHintsUsed] = useState(() => {
        const s=LS.get(gameKey()); return (s?.hints && s?.target===puzzle.target) ? s.hints : [];
      });
      const [input, setInput] = useState("");
      const [msg, setMsg] = useState(null);
      const [msgType, setMsgType] = useState("info");
      const [shake, setShake] = useState(false);
      const [modal, setModal] = useState(null);
      const [historyGames, setHistoryGames] = useState([]);
      const [historyDetail, setHistoryDetail] = useState(null);
      const [celebrate, setCelebrate] = useState(null);
      const [stats, setStats] = useState(() => LS.get("rt-stats-v2") || DEF_STATS);
      const inputRef = useRef(null);
      const wordsRef = useRef(null);
      const prevRank = useRef(null);
      const msgT = useRef(null);
      const recorded = useRef(false);

      const pts = found.reduce((a,w)=>a+w.length,0);
      const rank = getRank(pts, maxPts);
      const pct = maxPts>0 ? (pts/maxPts)*100 : 0;
      const done = found.length === puzzle.rhymes.length;
      const hintsLeft = MAX_HINTS - hintsUsed.length;

      useEffect(() => {
        if (found.length>0 || hintsUsed.length>0)
          LS.set(gameKey(), { found, hints:hintsUsed, target:puzzle.target, ts:Date.now() });
      }, [found, hintsUsed]);

      useEffect(() => {
        if (prevRank.current && prevRank.current!==rank.name && rank.name!=="Beginner") {
          setCelebrate(rank.name); setTimeout(()=>setCelebrate(null), 2200);
        }
        prevRank.current = rank.name;
      }, [rank]);

      useEffect(() => {
        if (recorded.current) return;
        if (done || rank.name==="Genius") {
          recorded.current = true;
          const s = LS.get("rt-stats-v2") || {...DEF_STATS};
          const today = dayNum();
          if (s.lastDay===today) return;
          s.games++; if (done) s.wins++;
          s.ranks[rank.name] = (s.ranks[rank.name]||0)+1;
          s.streak = s.lastDay===today-1 ? s.streak+1 : 1;
          s.maxStreak = Math.max(s.maxStreak, s.streak);
          s.lastDay = today;
          setStats(s); LS.set("rt-stats-v2", s);
        }
      }, [done, rank]);

      useEffect(() => {
        if (wordsRef.current) wordsRef.current.scrollTop = wordsRef.current.scrollHeight;
      }, [found]);

      useEffect(() => {
        if (modal === "history") { setHistoryGames(loadHistory()); setHistoryDetail(null); }
      }, [modal]);

      const flash = useCallback((t,type="info",dur=2200) => {
        if (msgT.current) clearTimeout(msgT.current);
        setMsg(t); setMsgType(type);
        msgT.current = setTimeout(()=>setMsg(null), dur);
      }, []);

      const submit = useCallback(() => {
        const g=input.trim().toLowerCase(); setInput("");
        if (!g) return;
        if (found.includes(g)) { flash("Already found!","warn"); setShake(true); setTimeout(()=>setShake(false),500); return; }
        if (g===puzzle.target) { flash("That's the target word!","warn"); setShake(true); setTimeout(()=>setShake(false),500); return; }
        if (puzzle.rhymes.includes(g)) {
          setFound(p=>[...p,g].sort());
          flash(`+${g.length} pts — "${g}" ✓`,"ok");
          if (found.length+1===puzzle.rhymes.length) setTimeout(()=>flash("🎉 You found them all!","ok",5000),600);
        } else { flash(`"${g}" — not in the list`,"err"); setShake(true); setTimeout(()=>setShake(false),500); }
        inputRef.current?.focus();
      }, [input, found, puzzle, flash]);

      const useHint = useCallback(() => {
        const unfound = puzzle.rhymes.filter(w=>!found.includes(w)&&!hintsUsed.includes(w));
        if (unfound.length===0 || hintsLeft<=0) return;
        const word = unfound[Math.floor(Math.random()*unfound.length)];
        setHintsUsed(prev=>[...prev,word]);
        flash(`💡 ${word.length} letters, starts with "${word[0].toUpperCase()}"`, "hint", 4000);
        inputRef.current?.focus();
      }, [puzzle, found, hintsUsed, hintsLeft, flash]);

      // ─── VIRAL SHARE SYSTEM ───
      const buildGrid = useCallback(() => {
        const buckets = [{words:[]},{words:[]},{words:[]}];
        puzzle.rhymes.forEach(w => {
          if (w.length <= 4) buckets[0].words.push(w);
          else if (w.length <= 6) buckets[1].words.push(w);
          else buckets[2].words.push(w);
        });
        return buckets.filter(b => b.words.length > 0).map(b => {
          const f = b.words.filter(w => found.includes(w)).length;
          const t = b.words.length;
          const cap = Math.min(t, 12);
          const filled = Math.round((f / t) * cap);
          return { found: f, total: t, filled, cap };
        });
      }, [puzzle, found]);

      const shareText = () => {
        const grid = buildGrid();
        const rows = grid.map(b => "🟨".repeat(b.filled) + "⬛".repeat(b.cap - b.filled));
        const hintTxt = hintsUsed.length > 0 ? ` (${hintsUsed.length} hint${hintsUsed.length>1?"s":""})` : "";
        const streakTxt = stats.streak > 1 ? `\n🔥 ${stats.streak}-day streak` : "";
        const t = `🃏 Rhyme Time #${pNum}\n\n${rows.join("\n")}\n\n${rank.name} · ${found.length}/${puzzle.rhymes.length} rhymes${hintTxt}${streakTxt}\n\nrhymetime.xyz`;
        if (navigator.share) { navigator.share({ text: t }).catch(()=>{}); }
        else { navigator.clipboard.writeText(t).then(()=>flash("Copied to clipboard!","ok")); }
      };

      const shareImage = useCallback(() => {
        const W = 1080, H = 1350; // 4:5 Instagram ratio
        const c = document.createElement("canvas"); c.width = W; c.height = H;
        const ctx = c.getContext("2d");

        // ─── HELPERS ───
        const rr = (x,y,w,h,r) => { ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r); ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath(); };
        const sans = (wt, sz) => `${wt} ${sz}px -apple-system, 'Helvetica Neue', Arial, sans-serif`;
        const serif = (sz) => `${sz}px Georgia, 'Times New Roman', serif`;

        // ─── BACKGROUND ───
        ctx.fillStyle = "#15131A"; ctx.fillRect(0, 0, W, H);

        // Warm radial glow
        const glow = ctx.createRadialGradient(W/2, H*0.35, 0, W/2, H*0.35, 500);
        glow.addColorStop(0, "rgba(232,185,49,0.08)");
        glow.addColorStop(0.5, "rgba(105,73,209,0.04)");
        glow.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);

        // Subtle noise via tiny dots
        ctx.fillStyle = "rgba(255,255,255,0.015)";
        for (let i = 0; i < 3000; i++) {
          ctx.fillRect(Math.random()*W, Math.random()*H, 1, 1);
        }

        // ─── CARD ───
        const cardX = 60, cardY = 50, cardW = W - 120, cardH = H - 100, cardR = 32;
        // Card shadow
        ctx.shadowColor = "rgba(0,0,0,0.4)"; ctx.shadowBlur = 60; ctx.shadowOffsetY = 10;
        ctx.fillStyle = "#1E1C24";
        rr(cardX, cardY, cardW, cardH, cardR); ctx.fill();
        ctx.shadowColor = "transparent";

        // Card border (subtle)
        ctx.strokeStyle = "rgba(255,255,255,0.06)"; ctx.lineWidth = 1;
        rr(cardX, cardY, cardW, cardH, cardR); ctx.stroke();

        // Inner card gradient (very subtle warm at top)
        const cardGrad = ctx.createLinearGradient(0, cardY, 0, cardY + 300);
        cardGrad.addColorStop(0, "rgba(232,185,49,0.03)");
        cardGrad.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = cardGrad;
        rr(cardX, cardY, cardW, cardH, cardR); ctx.fill();

        const cx = W / 2;

        // ─── JESTER ICON (drawn as paths) ───
        ctx.save(); ctx.translate(cx, 160); ctx.scale(1.2, 1.2);
        // Card shape
        ctx.fillStyle = "#2A2733";
        rr(-34, -44, 68, 88, 8); ctx.fill();
        ctx.strokeStyle = "rgba(232,185,49,0.3)"; ctx.lineWidth = 1;
        rr(-34, -44, 68, 88, 8); ctx.stroke();
        // Crown/hat points
        ctx.fillStyle = "#E8B931";
        ctx.beginPath(); ctx.moveTo(-12,-20); ctx.lineTo(-18,-38); ctx.lineTo(-4,-28); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(0,-24); ctx.lineTo(0,-42); ctx.lineTo(8,-28); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(12,-20); ctx.lineTo(18,-38); ctx.lineTo(4,-28); ctx.closePath(); ctx.fill();
        // Face circle
        ctx.fillStyle = "#3D3750"; ctx.beginPath(); ctx.arc(0,6,16,0,Math.PI*2); ctx.fill();
        ctx.fillStyle = "#E8B931"; ctx.beginPath(); ctx.arc(0,6,12,0,Math.PI*2); ctx.fill();
        // Eyes (X X)
        ctx.strokeStyle = "#1E1C24"; ctx.lineWidth = 2.2; ctx.lineCap = "round";
        [[-5,3],[5,3]].forEach(([ex,ey]) => {
          ctx.beginPath(); ctx.moveTo(ex-3,ey-3); ctx.lineTo(ex+3,ey+3); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(ex+3,ey-3); ctx.lineTo(ex-3,ey+3); ctx.stroke();
        });
        // Smile
        ctx.beginPath(); ctx.arc(0, 8, 6, 0.2, Math.PI-0.2); ctx.strokeStyle="#1E1C24"; ctx.lineWidth=2; ctx.stroke();
        // Corner pips
        ctx.fillStyle = "#E8B931"; ctx.font = "bold 11px sans-serif"; ctx.textAlign = "center";
        ctx.fillText("♦", -24, -30); ctx.fillText("♦", 24, 36);
        ctx.restore();

        // ─── HEADER ───
        ctx.textAlign = "center";
        ctx.fillStyle = "rgba(232,185,49,0.6)";
        ctx.font = sans("600", 18);
        ctx.letterSpacing = "6px";
        ctx.fillText("R H Y M E   T I M E", cx, 260);
        ctx.letterSpacing = "0px";

        ctx.fillStyle = "rgba(255,255,255,0.3)";
        ctx.font = sans("500", 16);
        ctx.fillText(`Puzzle #${pNum}  ·  ${dateStr()}`, cx, 290);

        // ─── TARGET WORD ───
        // Glow behind word
        ctx.shadowColor = "rgba(232,185,49,0.15)"; ctx.shadowBlur = 40;
        ctx.fillStyle = "#F5F0E8";
        ctx.font = serif(88);
        ctx.fillText(puzzle.target, cx, 400);
        ctx.shadowColor = "transparent";

        // Subtitle
        ctx.fillStyle = "rgba(255,255,255,0.25)";
        ctx.font = sans("400", 18);
        ctx.fillText("find the rhymes", cx, 440);

        // ─── DIVIDER ───
        const divW = 200;
        const divGrad = ctx.createLinearGradient(cx - divW/2, 0, cx + divW/2, 0);
        divGrad.addColorStop(0, "rgba(232,185,49,0)");
        divGrad.addColorStop(0.5, "rgba(232,185,49,0.3)");
        divGrad.addColorStop(1, "rgba(232,185,49,0)");
        ctx.fillStyle = divGrad;
        ctx.fillRect(cx - divW/2, 465, divW, 1);

        // ─── GRID ───
        const grid = buildGrid();
        const sqSize = 52, gap = 7, cornerRad = 10;
        const gridStartY = 500;
        const rowLabels = ["short", "medium", "long"];

        grid.forEach((bucket, rowIdx) => {
          const rowWidth = bucket.cap * (sqSize + gap) - gap;
          const startX = (W - rowWidth) / 2;
          const y = gridStartY + rowIdx * (sqSize + gap + 16);

          // Row label
          ctx.fillStyle = "rgba(255,255,255,0.2)";
          ctx.font = sans("500", 13);
          ctx.textAlign = "right";
          ctx.fillText(rowLabels[rowIdx] || "", startX - 16, y + sqSize/2 + 4);
          ctx.textAlign = "center";

          for (let i = 0; i < bucket.cap; i++) {
            const x = startX + i * (sqSize + gap);
            const isFilled = i < bucket.filled;

            if (isFilled) {
              // Gold tile with subtle glow
              ctx.shadowColor = "rgba(232,185,49,0.2)"; ctx.shadowBlur = 8;
              ctx.fillStyle = "#E8B931";
              rr(x, y, sqSize, sqSize, cornerRad); ctx.fill();
              ctx.shadowColor = "transparent";
              // Inner highlight
              const tg = ctx.createLinearGradient(x, y, x, y + sqSize);
              tg.addColorStop(0, "rgba(255,255,255,0.15)");
              tg.addColorStop(1, "rgba(0,0,0,0.05)");
              ctx.fillStyle = tg;
              rr(x, y, sqSize, sqSize, cornerRad); ctx.fill();
            } else {
              // Empty tile
              ctx.fillStyle = "#2A2733";
              rr(x, y, sqSize, sqSize, cornerRad); ctx.fill();
              ctx.strokeStyle = "rgba(255,255,255,0.04)"; ctx.lineWidth = 1;
              rr(x, y, sqSize, sqSize, cornerRad); ctx.stroke();
            }
          }

          // Count
          ctx.fillStyle = "rgba(255,255,255,0.2)";
          ctx.font = sans("600", 14);
          ctx.textAlign = "left";
          ctx.fillText(`${bucket.found}/${bucket.total}`, (W + rowWidth)/2 + 16, y + sqSize/2 + 5);
          ctx.textAlign = "center";
        });

        // ─── STATS AREA ───
        const statsY = gridStartY + grid.length * (sqSize + gap + 16) + 50;

        // Rank badge
        ctx.font = sans("700", 28);
        const rankText = rank.name;
        const rankW = ctx.measureText(rankText).width + 48;
        ctx.fillStyle = "rgba(232,185,49,0.1)";
        rr((W-rankW)/2, statsY - 20, rankW, 46, 23); ctx.fill();
        ctx.strokeStyle = "rgba(232,185,49,0.25)"; ctx.lineWidth = 1;
        rr((W-rankW)/2, statsY - 20, rankW, 46, 23); ctx.stroke();
        ctx.fillStyle = "#E8B931";
        ctx.fillText(rankText, cx, statsY + 10);

        // Score
        ctx.fillStyle = "rgba(255,255,255,0.5)";
        ctx.font = sans("500", 22);
        const hintTxt = hintsUsed.length > 0 ? `  ·  ${hintsUsed.length} hint${hintsUsed.length>1?"s":""}` : "";
        ctx.fillText(`${found.length} of ${puzzle.rhymes.length} rhymes  ·  ${pts}/${maxPts} pts${hintTxt}`, cx, statsY + 56);

        // Streak
        if (stats.streak > 1) {
          ctx.fillStyle = "#E8B931";
          ctx.font = sans("700", 22);
          ctx.fillText(`🔥 ${stats.streak}-day streak`, cx, statsY + 96);
        }

        // ─── PROGRESS BAR ───
        const barY = statsY + (stats.streak > 1 ? 125 : 90);
        const barW = 480, barH = 6;
        ctx.fillStyle = "#2A2733";
        rr((W-barW)/2, barY, barW, barH, 3); ctx.fill();
        const fillW = Math.max(0, Math.min(pct/100, 1)) * barW;
        if (fillW > 2) {
          const barGrad = ctx.createLinearGradient((W-barW)/2, 0, (W-barW)/2 + fillW, 0);
          barGrad.addColorStop(0, "#B8A4F8"); barGrad.addColorStop(1, "#E8B931");
          ctx.fillStyle = barGrad;
          rr((W-barW)/2, barY, fillW, barH, 3); ctx.fill();
        }

        // ─── FOOTER ───
        // Divider
        ctx.fillStyle = divGrad;
        ctx.fillRect(cx - divW/2, H - 155, divW, 1);

        ctx.fillStyle = "rgba(255,255,255,0.2)";
        ctx.font = sans("400", 16);
        ctx.fillText("A daily word game — new puzzle every day", cx, H - 120);

        ctx.fillStyle = "#E8B931";
        ctx.font = sans("700", 26);
        ctx.fillText("rhymetime.xyz", cx, H - 80);

        // ─── EXPORT ───
        c.toBlob(blob => {
          const file = new File([blob], `rhymetime-${pNum}.png`, {type:"image/png"});
          if (navigator.share && navigator.canShare?.({files:[file]})) {
            navigator.share({ files:[file], text:`🃏 Rhyme Time #${pNum} — rhymetime.xyz` }).catch(()=>{});
          } else {
            const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
            a.download = file.name; a.click(); URL.revokeObjectURL(a.href);
            flash("Image saved!", "ok");
          }
        }, "image/png");
      }, [buildGrid, pNum, puzzle, found, pts, maxPts, rank, pct, hintsUsed, stats, flash]);

      const nextRank = RANKS.find(r => r.threshold > pct/100) || RANKS[RANKS.length-1];
      const nextPts = Math.ceil(nextRank.threshold * maxPts);

      return (
        <div style={S.shell}>
          <div style={S.app}>

            {/* ─── HEADER (compact single row) ─── */}
            <header style={S.header}>
              <div style={S.brandRow}>
                <Logo size={28} />
                <h1 style={S.title}>Rhyme Time</h1>
                <span style={S.puzzleNum}>#{pNum}</span>
                {stats.streak > 0 && <div style={S.streakBadge}>🔥 {stats.streak}</div>}
              </div>
              <nav style={S.nav}>
                <NavIcon onClick={()=>setModal("history")} title="Past Games">{Ic.history}</NavIcon>
                <NavIcon onClick={()=>setModal("stats")} title="Stats">{Ic.stats}</NavIcon>
                <NavIcon onClick={()=>setModal("ranks")} title="Rankings">{Ic.ranks}</NavIcon>
                <NavIcon onClick={()=>setModal("how")} title="How to Play">{Ic.help}</NavIcon>
              </nav>
            </header>

            {/* ─── TARGET + INPUT (hero zone) ─── */}
            <div style={S.hero}>
              <p style={S.targetLabel}>{dateStr()} · Find words that rhyme with</p>
              <h2 style={S.targetWord}>{puzzle.target}</h2>

              {/* Progress */}
              <div style={S.progressRow}>
                <span style={S.rankTag}>{rank.name}</span>
                <div style={S.track}>
                  <div style={S.trackInner}>
                    <div style={{...S.fill, width:`${Math.min(pct,100)}%`}} />
                  </div>
                  {RANKS.slice(1).map((r,i) => (
                    <div key={i} style={{...S.milestone, left:`${r.threshold*100}%`,
                      background: pts/maxPts >= r.threshold ? "#6949D1" : "#D1CEC8"}} />
                  ))}
                </div>
                <span style={S.ptsTag}>{pts}/{maxPts}</span>
              </div>

              {/* Input */}
              <div style={{...S.inputRow, animation: shake ? "shake 0.4s ease" : "none"}}>
                <input ref={inputRef} type="text" value={input}
                  onChange={e=>setInput(e.target.value.replace(/[^a-zA-Z]/g,""))}
                  onKeyDown={e=>e.key==="Enter"&&submit()}
                  placeholder={done ? "All found! 🎉" : "Type a rhyme..."}
                  style={S.input} autoFocus autoComplete="off" autoCapitalize="off" spellCheck="false" disabled={done}
                />
                <button onClick={submit} disabled={done||!input}
                  style={{...S.enterBtn, opacity:input?1:0.35}}>→</button>
              </div>

              {/* Action pills */}
              <div style={S.actions}>
                {!done && (
                  <button style={{...S.pill, ...S.hintPill, opacity:hintsLeft>0?1:0.4}}
                    onClick={useHint} disabled={hintsLeft<=0}>
                    {Ic.hint}<span>Hint ({hintsLeft})</span>
                  </button>
                )}
                <button style={S.pill} onClick={shareText}>{Ic.share}<span>Share</span></button>
                <button style={{...S.pill,...S.imgPill}} onClick={shareImage}>{Ic.camera}<span>Image</span></button>
                {done && <button style={{...S.pill,...S.viewAllPill}} onClick={()=>setModal("answers")}>View All</button>}
              </div>
            </div>

            {/* ─── FOUND WORDS (scrollable) ─── */}
            <div ref={wordsRef} style={S.wordZone}>
              <div style={S.wordHeader}>
                <span style={S.wordCount}>{found.length} of {puzzle.rhymes.length} found</span>
                {!done && found.length>0 && <span style={S.wordRemain}>{puzzle.rhymes.length-found.length} to go</span>}
                {done && <span style={{...S.wordRemain, color:"#16A34A", fontWeight:600}}>Complete! 🎉</span>}
              </div>
              {found.length === 0 ? (
                <div style={S.rulesInline}>
                  <div style={S.rulesInlineHeader}>
                    <Logo size={20} />
                    <span style={{fontWeight:600,color:"#2D2B2E",fontSize:13}}>How to Play</span>
                  </div>
                  <div style={S.rulesInlineGrid}>
                    {[
                      ["🎯", "Type a rhyming word and press Enter"],
                      ["📏", "Score points equal to the word's length"],
                      ["🔤", "Multi-syllable words count too!"],
                      ["💡", `${MAX_HINTS} hints per puzzle if you're stuck`],
                    ].map(([ic,txt],i) => (
                      <div key={i} style={S.rulesInlineRow}>
                        <span style={{fontSize:13,flexShrink:0}}>{ic}</span>
                        <span style={{fontSize:12,color:"#78746E",lineHeight:"1.3"}}>{txt}</span>
                      </div>
                    ))}
                  </div>
                </div>
              ) : (
                <div style={S.chips}>
                  {found.map((w,i) => (
                    <span key={w} style={{...S.chip, animationDelay:`${Math.max(0,i-found.length+3)*0.04}s`}}>
                      {w}<span style={S.chipPt}>+{w.length}</span>
                    </span>
                  ))}
                </div>
              )}

              {/* ─── MISSED WORDS (shown when game complete or user taps View All) ─── */}
              {done && (() => {
                const missed = puzzle.rhymes.filter(w => !found.includes(w));
                return missed.length > 0 ? (
                  <div style={S.missedSection}>
                    <div style={S.missedHeader}>Words you missed ({missed.length})</div>
                    <div style={S.chips}>
                      {missed.sort().map(w => (
                        <span key={w} style={{...S.chip, ...S.missedChip, animation:"none"}}>{w}</span>
                      ))}
                    </div>
                  </div>
                ) : null;
              })()}
            </div>

            {/* ─── FOOTER (coffee prominent) ─── */}
            <div style={S.footer}>
              <div style={S.footerLeft}>
                <Logo size={14} />
                <span style={S.footerText}>Rhyme Time</span>
              </div>
              <a href="https://buymeacoffee.com/rhymetime" target="_blank" rel="noopener" style={S.coffeeBtn}>
                {Ic.coffee}
                <span>Buy us a coffee</span>
              </a>
            </div>

            {/* ─── OVERLAYS ─── */}
            {msg && <div style={{...S.toast,
              background: msgType==="ok"?"#16A34A":msgType==="err"?"#DC2626":msgType==="warn"?"#D97706":msgType==="hint"?"#6949D1":"#6B7280"
            }}>{msg}</div>}

            {celebrate && <div style={S.celebOverlay}><span style={S.celebText}>{celebrate}!</span></div>}

            {/* ═══════ MODALS ═══════ */}
            {modal && (
              <div style={S.overlay} onClick={()=>setModal(null)}>
                <div style={S.modal} onClick={e=>e.stopPropagation()}>
                  <button style={S.closeX} onClick={()=>setModal(null)}>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                  </button>

                  {modal==="how" && <>
                    <div style={{textAlign:"center", marginBottom:14}}><Logo size={44} /></div>
                    <h2 style={S.mTitle}>How to Play</h2>
                    <p style={S.mBody}>Find all the words that rhyme with the <strong>target word</strong>. Short and multi-syllable words both count!</p>
                    <div style={S.rules}>
                      {[
                        ["🎯","Type a rhyming word and press Enter"],
                        ["📏","Score points equal to the word's letter count"],
                        ["📈","Climb ranks from Beginner to Rhyme Master"],
                        ["🔤","Multi-syllable words count — 'impressed' rhymes with 'best'"],
                        ["💡",`${MAX_HINTS} hints per puzzle — reveals first letter & word length`],
                        ["🔥","Play daily to build your streak"],
                      ].map(([ic,txt],i) => (
                        <div key={i} style={S.ruleRow}><span style={{fontSize:15,flexShrink:0}}>{ic}</span><span>{txt}</span></div>
                      ))}
                    </div>
                    <div style={S.mimeBox}>
                      <Logo size={22} />
                      <p style={S.mimeText}><em>"Don't overthink, just let words flow —<br/>if it sounds right, give it a go!"</em></p>
                    </div>
                  </>}

                  {modal==="ranks" && <>
                    <h2 style={S.mTitle}>Rankings</h2>
                    <p style={{color:"#A8A4A0",fontSize:12,marginBottom:10}}>Based on % of {maxPts} possible points.</p>
                    <div style={{display:"flex",flexDirection:"column",gap:3}}>
                      {RANKS.map((r,i) => {
                        const cur = rank.name===r.name;
                        return (
                          <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"8px 12px",borderRadius:8,
                            border:cur?"2px solid #6949D1":"1px solid #EDECEA",
                            background:cur?"#F3F0FF":"transparent",fontWeight:cur?700:400,fontSize:13}}>
                            <span>{r.name}</span>
                            <span style={{color:"#A8A4A0"}}>{Math.ceil(r.threshold*maxPts)} pts</span>
                          </div>
                        );
                      })}
                    </div>
                  </>}

                  {modal==="answers" && <>
                    <h2 style={S.mTitle}>All Rhymes for "{puzzle.target}"</h2>
                    <div style={S.mChips}>
                      {[...puzzle.rhymes].sort().map(w => (
                        <span key={w} style={{...S.chip,
                          background:found.includes(w)?"#ECFDF5":"#FEF2F2",
                          borderColor:found.includes(w)?"#86EFAC":"#FECACA",animation:"none"}}>
                          {found.includes(w)?"✓ ":"✗ "}{w}
                        </span>
                      ))}
                    </div>
                  </>}

                  {modal==="stats" && <>
                    <h2 style={S.mTitle}>Statistics</h2>
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginTop:10}}>
                      {[[stats.games,"Played"],[stats.wins,"Completed"],[stats.streak,"Streak 🔥"],[stats.maxStreak,"Best Streak"]].map(([v,l],i) => (
                        <div key={i} style={{textAlign:"center",padding:"14px 6px",background:"#FAF9F7",borderRadius:10,border:"1px solid #EDECEA"}}>
                          <div style={{fontSize:26,fontWeight:700,color:"#6949D1"}}>{v}</div>
                          <div style={{fontSize:10,color:"#A8A4A0",fontWeight:600,marginTop:2,textTransform:"uppercase",letterSpacing:"0.5px"}}>{l}</div>
                        </div>
                      ))}
                    </div>
                    <h3 style={{fontSize:11,color:"#A8A4A0",marginTop:18,marginBottom:6,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.5px"}}>Rank Distribution</h3>
                    <div style={{display:"flex",flexDirection:"column",gap:3}}>
                      {RANKS.map((r,i) => {
                        const c = stats.ranks[r.name]||0;
                        const mx = Math.max(1,...Object.values(stats.ranks).map(Number));
                        return (
                          <div key={i} style={{display:"flex",alignItems:"center",gap:6,fontSize:11}}>
                            <span style={{width:68,textAlign:"right",color:"#A8A4A0",flexShrink:0}}>{r.name}</span>
                            <div style={{flex:1,height:14,background:"#EDECEA",borderRadius:99,overflow:"hidden"}}>
                              <div style={{height:"100%",width:`${c>0?Math.max(8,(c/mx)*100):0}%`,background:"linear-gradient(90deg,#A78BFA,#6949D1)",borderRadius:99}} />
                            </div>
                            <span style={{width:16,color:"#6949D1",fontWeight:700,textAlign:"right"}}>{c}</span>
                          </div>
                        );
                      })}
                    </div>
                    <div style={S.mimeBox}>
                      <Logo size={18} />
                      <p style={S.mimeText}><em>"Your stats are here, both high and low —<br/>keep playing daily, watch them grow!"</em></p>
                    </div>
                  </>}

                  {modal==="history" && <>
                    {historyDetail ? <>
                      {/* ─── DETAIL VIEW ─── */}
                      <button onClick={()=>setHistoryDetail(null)} style={{background:"none",border:"none",color:"#6949D1",fontSize:12,fontWeight:600,padding:"0 0 8px",display:"flex",alignItems:"center",gap:4,cursor:"pointer"}}>
                        ← Back to history
                      </button>
                      <h2 style={S.mTitle}>Puzzle #{historyDetail.num} — "{historyDetail.target}"</h2>
                      <p style={{color:"#A8A4A0",fontSize:12,marginBottom:8}}>{historyDetail.label} · {historyDetail.rank} · {historyDetail.pts}/{historyDetail.maxPts} pts{historyDetail.hints > 0 ? ` · ${historyDetail.hints} hint${historyDetail.hints>1?"s":""}` : ""}</p>

                      {historyDetail.found.length > 0 && <>
                        <p style={{fontSize:11,fontWeight:600,color:"#16A34A",marginBottom:4,textTransform:"uppercase",letterSpacing:"0.5px"}}>Found ({historyDetail.found.length})</p>
                        <div style={S.mChips}>
                          {historyDetail.found.sort().map(w => (
                            <span key={w} style={{...S.chip,background:"#ECFDF5",borderColor:"#86EFAC",animation:"none"}}>✓ {w}</span>
                          ))}
                        </div>
                      </>}

                      {historyDetail.missed.length > 0 && <>
                        <p style={{fontSize:11,fontWeight:600,color:"#DC2626",marginTop:12,marginBottom:4,textTransform:"uppercase",letterSpacing:"0.5px"}}>Missed ({historyDetail.missed.length})</p>
                        <div style={S.mChips}>
                          {historyDetail.missed.sort().map(w => (
                            <span key={w} style={{...S.chip,background:"#FEF2F2",borderColor:"#FECACA",animation:"none"}}>✗ {w}</span>
                          ))}
                        </div>
                      </>}
                    </> : <>
                      {/* ─── LIST VIEW ─── */}
                      <h2 style={S.mTitle}>Past Games</h2>
                      {historyGames.length === 0 ? (
                        <div style={{textAlign:"center",padding:"24px 0",color:"#A8A4A0"}}>
                          <p style={{fontSize:13}}>No past games yet!</p>
                          <p style={{fontSize:11,marginTop:4}}>Come back tomorrow to see today's results here.</p>
                        </div>
                      ) : (
                        <div style={{display:"flex",flexDirection:"column",gap:4}}>
                          {historyGames.map(g => (
                            <button key={g.num} onClick={()=>setHistoryDetail(g)} style={S.historyRow}>
                              <div style={{display:"flex",alignItems:"center",gap:8,flex:1,minWidth:0}}>
                                <span style={{fontSize:11,color:"#A8A4A0",minWidth:38}}>#{g.num}</span>
                                <span style={{fontFamily:"'DM Serif Display', serif",fontSize:16,color:"#2D2B2E",fontWeight:400}}>{g.target}</span>
                                <span style={{fontSize:11,color:g.done?"#16A34A":"#A8A4A0",fontWeight:g.done?600:400}}>{g.found.length}/{g.total}</span>
                              </div>
                              <div style={{display:"flex",alignItems:"center",gap:6}}>
                                <span style={{fontSize:10,color:"#6949D1",fontWeight:600}}>{g.rank}</span>
                                <span style={{fontSize:10,color:"#A8A4A0"}}>{g.label}</span>
                                <span style={{color:"#D1CEC8",fontSize:11}}>›</span>
                              </div>
                            </button>
                          ))}
                        </div>
                      )}
                      <div style={S.mimeBox}>
                        <Logo size={18} />
                        <p style={S.mimeText}><em>"The rhymes you've found, the ones you've missed —<br/>each puzzle played adds to your list!"</em></p>
                      </div>
                    </>}
                  </>}
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ─── STYLES ──────────────────────────────────────────────────────────
    const S = {
      shell: { height:"100%", display:"flex", justifyContent:"center", padding:"0 16px" },
      app: { width:"100%", maxWidth:460, display:"flex", flexDirection:"column", height:"100%", position:"relative" },

      // Header
      header: { display:"flex", justifyContent:"space-between", alignItems:"center", padding:"12px 0 8px", flexShrink:0 },
      brandRow: { display:"flex", alignItems:"center", gap:8 },
      title: { fontFamily:"'Instrument Serif', serif", fontSize:20, margin:0, color:"#2D2B2E", lineHeight:1 },
      puzzleNum: { fontSize:11, fontWeight:600, color:"#C4C0BB", marginLeft:-2 },
      streakBadge: { fontSize:11, fontWeight:700, color:"#D97706", background:"#FEF3C7", border:"1px solid #FDE68A", padding:"2px 7px", borderRadius:99, marginLeft:2 },
      nav: { display:"flex", gap:0 },

      // Hero zone: target + input
      hero: { flexShrink:0, textAlign:"center", paddingBottom:12 },
      targetLabel: { margin:0, fontSize:11, color:"#A8A4A0", fontWeight:500, letterSpacing:"0.2px" },
      targetWord: { fontFamily:"'DM Serif Display', serif", fontSize:52, color:"#2D2B2E", margin:"2px 0 10px", letterSpacing:"3px", fontWeight:400, lineHeight:1.1 },
      progressRow: { display:"flex", alignItems:"center", gap:8, marginBottom:14, padding:"0 4px" },
      rankTag: { fontSize:10, fontWeight:700, color:"#6949D1", whiteSpace:"nowrap", textTransform:"uppercase", letterSpacing:"0.5px", minWidth:58 },
      track: { flex:1, height:4, borderRadius:99, position:"relative" },
      trackInner: { position:"absolute", inset:0, background:"#E8E6E1", borderRadius:99, overflow:"hidden" },
      fill: { height:"100%", background:"linear-gradient(90deg, #B8A4F8, #6949D1)", borderRadius:99, transition:"width 0.5s cubic-bezier(0.4,0,0.2,1)" },
      milestone: { position:"absolute", top:"50%", transform:"translate(-50%,-50%)", width:6, height:6, borderRadius:"50%", border:"1.5px solid #F7F6F3", transition:"background 0.3s", zIndex:1 },
      ptsTag: { fontSize:10, color:"#A8A4A0", whiteSpace:"nowrap", fontWeight:600, minWidth:40, textAlign:"right" },
      inputRow: { display:"flex", gap:8, marginBottom:10, padding:"0 2px", textAlign:"left" },
      input: { flex:1, padding:"11px 14px", fontSize:16, borderRadius:10, border:"1.5px solid #E0DDD8", background:"#fff", fontFamily:"'DM Sans', sans-serif", color:"#2D2B2E", transition:"border-color 0.15s, box-shadow 0.15s" },
      enterBtn: { width:46, fontSize:18, fontWeight:700, borderRadius:10, border:"none", background:"#6949D1", color:"#fff", display:"flex", alignItems:"center", justifyContent:"center", transition:"opacity 0.15s" },
      actions: { display:"flex", justifyContent:"center", gap:6, flexWrap:"wrap" },
      pill: { padding:"5px 13px", fontSize:11, fontWeight:600, borderRadius:99, border:"1.5px solid #E0DDD8", background:"#fff", color:"#78746E", fontFamily:"'DM Sans', sans-serif", display:"inline-flex", alignItems:"center", gap:4, transition:"all 0.15s" },
      hintPill: { borderColor:"#DDD6FE", color:"#6949D1", background:"#F8F6FF" },
      imgPill: { borderColor:"#D1FAE5", color:"#065F46", background:"#F0FDF9" },
      viewAllPill: { background:"#6949D1", color:"#fff", borderColor:"#6949D1" },

      // Found words — scrollable middle
      wordZone: { flex:1, overflow:"auto", minHeight:0, background:"#FFFFFF", borderRadius:"12px 12px 0 0", border:"1px solid #EDECEA", borderBottom:"none", marginTop:8 },
      wordHeader: { display:"flex", justifyContent:"space-between", padding:"10px 14px", borderBottom:"1px solid #F5F4F2", position:"sticky", top:0, background:"#fff", zIndex:2 },
      wordCount: { fontSize:12, fontWeight:600, color:"#6949D1" },
      wordRemain: { fontSize:11, color:"#A8A4A0" },
      emptyState: { display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:"32px 16px", gap:4 },
      emptyIcon: { fontSize:32, opacity:0.3, marginBottom:4 },
      emptyText: { fontSize:13, color:"#A8A4A0", fontWeight:500 },
      emptySubtext: { fontSize:11, color:"#C4C0BB" },
      rulesInline: { padding:"16px 14px" },
      rulesInlineHeader: { display:"flex", alignItems:"center", gap:8, marginBottom:10, paddingBottom:8, borderBottom:"1px solid #F5F4F2" },
      rulesInlineGrid: { display:"flex", flexDirection:"column", gap:6 },
      rulesInlineRow: { display:"flex", alignItems:"flex-start", gap:8 },
      missedSection: { borderTop:"1px dashed #E0DDD8", margin:"4px 12px 0", padding:"10px 0 6px" },
      missedHeader: { fontSize:11, fontWeight:600, color:"#DC2626", marginBottom:6, textTransform:"uppercase", letterSpacing:"0.5px" },
      missedChip: { background:"#FEF2F2", borderColor:"#FECACA", color:"#991B1B" },
      historyRow: { display:"flex", justifyContent:"space-between", alignItems:"center", padding:"10px 12px", borderRadius:10, border:"1px solid #EDECEA", background:"#fff", fontFamily:"'DM Sans', sans-serif", cursor:"pointer", transition:"all 0.15s", width:"100%" },
      chips: { padding:"10px 12px", display:"flex", flexWrap:"wrap", gap:5 },
      chip: { padding:"4px 10px", borderRadius:99, fontSize:12, fontWeight:500, background:"#F8F6FF", color:"#3B1F8E", border:"1px solid #E9E5F5", display:"inline-flex", alignItems:"center", gap:4, animation:"popIn 0.2s ease both" },
      chipPt: { fontSize:9, color:"#A78BFA", fontWeight:700 },

      // Footer — coffee prominent
      footer: { flexShrink:0, display:"flex", justifyContent:"space-between", alignItems:"center", padding:"10px 4px 12px", borderTop:"1px solid #EDECEA" },
      footerLeft: { display:"flex", alignItems:"center", gap:6 },
      footerText: { fontSize:11, color:"#C4C0BB", fontWeight:500 },
      coffeeBtn: {
        display:"inline-flex", alignItems:"center", gap:5, padding:"6px 12px",
        borderRadius:99, background:"#FEF3C7", border:"1px solid #FDE68A",
        fontSize:11, fontWeight:600, color:"#92400E", textDecoration:"none",
        transition:"all 0.15s", cursor:"pointer",
      },

      // Overlays
      toast: { position:"absolute", top:10, left:"50%", transform:"translateX(-50%)", padding:"8px 20px", borderRadius:99, color:"#fff", fontSize:13, fontWeight:600, zIndex:100, animation:"fadeIn 0.2s ease", boxShadow:"0 4px 16px rgba(0,0,0,0.1)", whiteSpace:"nowrap", pointerEvents:"none" },
      celebOverlay: { position:"absolute", top:"30%", left:"50%", transform:"translate(-50%, -50%)", zIndex:50, pointerEvents:"none", animation:"celebrateFade 2.2s ease forwards" },
      celebText: { fontFamily:"'DM Serif Display', serif", fontSize:22, color:"#6949D1", background:"rgba(255,255,255,0.92)", padding:"8px 24px", borderRadius:10, boxShadow:"0 4px 20px rgba(105,73,209,0.12)" },

      // Modals
      overlay: { position:"fixed", inset:0, background:"rgba(0,0,0,0.2)", backdropFilter:"blur(3px)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:200, padding:20, animation:"fadeIn 0.15s ease" },
      modal: { background:"#fff", borderRadius:14, padding:"22px 20px 18px", maxWidth:380, width:"100%", maxHeight:"80vh", overflowY:"auto", position:"relative", boxShadow:"0 16px 48px rgba(0,0,0,0.1)", animation:"slideUp 0.2s ease" },
      closeX: { position:"absolute", top:12, right:12, background:"none", border:"none", color:"#C4C0BB", padding:4, borderRadius:6, display:"flex" },
      mTitle: { fontFamily:"'Instrument Serif', serif", fontSize:19, color:"#2D2B2E", marginBottom:6, marginTop:0 },
      mBody: { color:"#78746E", fontSize:13, lineHeight:1.6, marginBottom:4 },
      mChips: { display:"flex", flexWrap:"wrap", gap:5 },
      rules: { display:"flex", flexDirection:"column", gap:7, marginTop:10 },
      ruleRow: { display:"flex", alignItems:"flex-start", gap:8, fontSize:12, color:"#4A4744", lineHeight:1.4 },
      mimeBox: { marginTop:14, padding:10, background:"#FAF9F7", borderRadius:8, border:"1px solid #EDECEA", display:"flex", alignItems:"center", gap:8 },
      mimeText: { margin:0, fontSize:10, color:"#6949D1", fontWeight:500, lineHeight:1.5 },
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<RhymeTime />);
  </script>
</body>
</html>
